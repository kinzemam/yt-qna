services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ytqa
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ytqa"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    network_mode: host
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/ytqa
    volumes:
      - chroma_data:/app/chroma_db_gemini-embedding-001
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  chroma_data:
